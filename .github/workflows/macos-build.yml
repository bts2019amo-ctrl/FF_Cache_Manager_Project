name: iOS macOS validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate sources on macOS
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade pillow lief cryptography

      - name: Validate plist files
        run: |
          plutil -lint Info.plist FrameworkInfo.plist entitlements-jailbroken.plist entitlements-worse-query.example.plist

      - name: Compile policy tests
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fobjc-arc \
            tests/test_worse_query_policy.c FFWorseQuery.m vendor/worse_query/worse_query.m \
            -framework Foundation -o /tmp/ff-wq-policy
          /tmp/ff-wq-policy

      - name: Validate Python syntax
        run: python3 -m compileall -q .

      - name: Report full build prerequisite
        run: |
          echo "Validation completed on macOS."
          echo "Full unsigned IPA build requires donors/FilzaSlop_1.0.3.ipa, which is not included in the source archive."
