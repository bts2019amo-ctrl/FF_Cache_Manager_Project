name: iOS macOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate sources on macOS
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade pillow lief cryptography

      - name: Validate plist files
        run: |
          plutil -lint Info.plist FrameworkInfo.plist entitlements-jailbroken.plist entitlements-worse-query.example.plist

      - name: Compile policy tests
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fobjc-arc \
            tests/test_worse_query_policy.c FFWorseQuery.m vendor/worse_query/worse_query.m \
            -framework Foundation -o /tmp/ff-wq-policy
          /tmp/ff-wq-policy

      - name: Validate Python syntax
        run: python3 -m compileall -q .

      - name: Download and verify official donor IPA
        run: |
          mkdir -p donors
          curl -L --fail --retry 3 \
            -o donors/FilzaSlop_1.0.3.ipa \
            https://github.com/0xjohnnydev/FilzaSlop/releases/download/v1.0.3/FilzaSlop-v1.0.3-unsigned.ipa
          echo "aaec476e5e19ba41fe9c1abef7cb53444337769325f9f42ba90353a8661d9d96  donors/FilzaSlop_1.0.3.ipa" | shasum -a 256 -c -

      - name: Build unsigned IPA from this project
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh donors/FilzaSlop_1.0.3.ipa

      - name: Upload project IPA and manifests
        uses: actions/upload-artifact@v4
        with:
          name: ff-cache-manager-ios-build
          path: |
            dist/clean/*.ipa
            dist/clean/*.json
            dist/clean/*.sha256
